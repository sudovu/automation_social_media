services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: social-automation-hub-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: social-automation-hub-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health

  # 2. React Vite Frontend Dashboard
  - type: web
    name: social-automation-hub-dashboard
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: social-automation-hub-api
          property: host

  # 3. Background Scheduler & Polling Worker
  - type: worker
    name: social-automation-hub-worker
    runtime: docker
    dockerfilePath: worker/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: social-automation-hub-db
          property: connectionString

databases:
  - name: social-automation-hub-db
    plan: free
    region: oregon
    databaseName: social_automation_hub
    user: postgres
